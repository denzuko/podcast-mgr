# haproxy-podcast-socket.conf
# systemd drop-in: bind-mount nuci3's fcgiwrap socket into haproxy's chroot
#
# Install:
#   sudo mkdir -p /etc/systemd/system/haproxy.service.d/
#   sudo cp examples/haproxy-podcast-socket.conf \
#            /etc/systemd/system/haproxy.service.d/podcast-socket.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart haproxy
#
# Why:
#   haproxy's global { chroot /var/lib/haproxy } means unix socket paths
#   in server lines are resolved inside the chroot jail.  nuci3's socket
#   lives at /run/user/<UID>/podcast-mgr/fcgi.sock on the host.  This
#   drop-in bind-mounts that directory into the chroot so haproxy can
#   reach it at the chroot-relative path /run/podcast-mgr/fcgi.sock.
#
# Adjust the source path (/run/user/1001) if nuci3's UID differs:
#   id -u nuci3

[Service]
BindReadOnlyPaths=/run/user/1001/podcast-mgr:/var/lib/haproxy/run/podcast-mgr
