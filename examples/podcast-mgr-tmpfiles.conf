# podcast-mgr.conf — systemd-tmpfiles rule for shared fcgiwrap socket dir
#
# Creates /run/fcgi on boot with ownership nuci3:www-data so that:
#   - nuci3's fcgiwrap user unit can write the socket
#   - haproxy (group www-data) can connect to it from inside its chroot
#
# Install (one-time, requires root):
#   sudo cp examples/podcast-mgr-tmpfiles.conf /etc/tmpfiles.d/podcast-mgr.conf
#   sudo systemd-tmpfiles --create /etc/tmpfiles.d/podcast-mgr.conf
#
# The rule runs automatically at boot via systemd-tmpfiles-setup.service.
# No bind-mounts, no XDG_RUNTIME_DIR path games, no chroot complications.
#
# Format: type path mode user group age
d /run/fcgi 2770 nuci3 www-data -
