# nginx.conf — podcast-mgr FastCGI configuration
#
# Assumes:
#   - index.cgi is managed by fcgiwrap or spawn-fcgi on a Unix socket
#   - The SPA is mounted at /podcast/
#   - TLS termination handled upstream or by a separate server block
#
# Include in an existing server {} block or adapt as a standalone vhost.

server {
    listen       80;
    server_name  localhost;

    # Redirect bare /podcast to the SPA shell
    location = /podcast {
        return 301 /podcast/index.cgi/index;
    }

    # FastCGI proxy — all requests under /podcast/ go to index.cgi
    location /podcast/ {
        # Strip the mount prefix before passing PATH_INFO to kcgi
        fastcgi_split_path_info ^(/podcast/index\.cgi)(.*)$;

        fastcgi_pass  unix:/var/run/podcast-mgr/fcgi.sock;
        fastcgi_index index.cgi;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME  /usr/local/libexec/podcast-mgr/index.cgi;
        fastcgi_param SCRIPT_NAME      /podcast/index.cgi;
        fastcgi_param PATH_INFO        $fastcgi_path_info;
        fastcgi_param DOCUMENT_ROOT    /usr/local/libexec/podcast-mgr;

        # Pass the operator's XDG config path so index.cgi finds feeds.xml
        # Adjust to match the user that runs the FastCGI worker
        fastcgi_param HOME             /home/denzuko;
        # fastcgi_param XDG_CONFIG_HOME /home/denzuko/.config;

        # Timeouts — index.cgi is fast; these are conservative
        fastcgi_connect_timeout  5s;
        fastcgi_read_timeout    30s;
        fastcgi_send_timeout    10s;

        # Buffer tuning — responses are small HTML partials
        fastcgi_buffer_size          4k;
        fastcgi_buffers              8 4k;
        fastcgi_busy_buffers_size    8k;
    }

    # Block direct access to feeds.xml and schema files
    location ~ ^/podcast/(feeds\.xml|feeds\.xsd|feeds\.xsl) {
        deny all;
    }
}
