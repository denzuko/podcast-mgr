# fcgiwrap.conf — spawn and socket configuration for podcast-mgr
#
# fcgiwrap is the lightest-weight way to run a FastCGI worker on BSD/Linux.
#
# Deployment patterns covered:
#   1. systemd USER unit  — fcgiwrap runs as nuci3, haproxy (root/system)
#                           picks up the socket via filesystem ACL
#   2. rc.d / daemon      — FreeBSD / OpenBSD
#   3. spawn-fcgi         — quick start, any POSIX system

# ── 1. systemd USER unit (Linux — nuci3 + system haproxy) ─────────────────
#
# Why user units here:
#   - index.cgi runs as nuci3 and reads ~/.config/podcasts/feeds.xml
#   - nuci3 cannot write to /var/run without elevated privileges
#   - $XDG_RUNTIME_DIR (/run/user/$(id -u)) is writable by nuci3 and
#     is cleaned up automatically on logout
#   - haproxy (system package, runs as root or haproxy group) needs
#     rx on the socket directory and rw on the socket itself
#
# Socket permission bridge (one-time root setup):
#
#   # Add haproxy's runtime user to nuci3's group  — OR —
#   # set a filesystem ACL on the socket dir so haproxy can connect.
#   #
#   # Option A: group membership (simpler, survives reboots)
#   sudo usermod -aG nuci3 haproxy      # Debian/Ubuntu (haproxy runs as 'haproxy')
#   sudo usermod -aG nuci3 www-data     # if haproxy runs as www-data
#
#   # Option B: ACL on the runtime dir (no group change needed)
#   sudo setfacl -m u:haproxy:rx /run/user/$(id -u nuci3)
#   sudo setfacl -m u:haproxy:rx /run/user/$(id -u nuci3)/podcast-mgr
#   # The socket itself inherits rw via the default ACL set below.
#   sudo setfacl -dm u:haproxy:rw /run/user/$(id -u nuci3)/podcast-mgr
#
# Enable lingering so the user unit starts at boot without a login session:
#
#   sudo loginctl enable-linger nuci3
#
# ── Unit files ────────────────────────────────────────────────────────────
#
# Install to:  ~/.config/systemd/user/
# Enable with: systemctl --user enable --now podcast-mgr.socket
#
# ~/.config/systemd/user/podcast-mgr.socket
# ------------------------------------------
# [Unit]
# Description=podcast-mgr fcgiwrap socket
#
# [Socket]
# ListenStream=%t/podcast-mgr/fcgi.sock
#   # %t expands to $XDG_RUNTIME_DIR (/run/user/UID) — writable by nuci3,
#   # world-inaccessible by default (mode 0700).  The ACL or group setup
#   # above grants haproxy access without opening it to everyone.
# SocketMode=0660
# DirectoryMode=0750
# RuntimeDirectory=podcast-mgr
# RuntimeDirectoryMode=0750
#
# [Install]
# WantedBy=sockets.target
#
# ~/.config/systemd/user/podcast-mgr.service
# --------------------------------------------
# [Unit]
# Description=podcast-mgr FastCGI worker
# Requires=podcast-mgr.socket
# After=podcast-mgr.socket
#
# [Service]
# Type=simple
#
# ExecStart=/usr/bin/fcgiwrap -s unix:%t/podcast-mgr/fcgi.sock
#   # fcgiwrap exec()s index.cgi per FastCGI request.
#   # It inherits the socket from systemd socket activation.
#   # Adjust path to index.cgi via SCRIPT_FILENAME in haproxy.cfg.
#
# Environment=HOME=%h
#   # %h expands to the user's home directory (/home/nuci3).
#   # index.cgi calls getenv("HOME") via resolve_config_path to locate
#   # ~/.config/podcasts/feeds.xml.
#
# Restart=on-failure
# RestartSec=5s
#
# [Install]
# WantedBy=default.target
#
# ── haproxy.cfg adjustment for user socket path ───────────────────────────
#
# Replace the server line in backend podcast_fcgi with the XDG runtime path:
#
#   server fcgi1 unix@/run/user/1001/podcast-mgr/fcgi.sock proto fcgi
#                              ^^^^
#                              nuci3's UID — find with: id -u nuci3
#
# Or use a stable symlink to avoid hardcoding the UID:
#
#   sudo ln -s /run/user/$(id -u nuci3)/podcast-mgr/fcgi.sock \
#              /run/podcast-mgr-nuci3.sock
#   # then in haproxy.cfg:
#   server fcgi1 unix@/run/podcast-mgr-nuci3.sock proto fcgi
#
# ── Bootstrap sequence ────────────────────────────────────────────────────
#
#   # One-time (root):
#   sudo loginctl enable-linger nuci3
#   sudo usermod -aG nuci3 haproxy        # or setfacl — see above
#   sudo systemctl reload haproxy         # pick up group change
#
#   # As nuci3:
#   mkdir -p ~/.config/systemd/user
#   cp examples/podcast-mgr.socket ~/.config/systemd/user/
#   cp examples/podcast-mgr.service ~/.config/systemd/user/
#   systemctl --user daemon-reload
#   systemctl --user enable --now podcast-mgr.socket
#
#   # Verify:
#   systemctl --user status podcast-mgr.socket podcast-mgr.service
#   ls -la /run/user/$(id -u)/podcast-mgr/fcgi.sock


# ── 2. FreeBSD rc.d ───────────────────────────────────────────────────────
#
# /usr/local/etc/rc.d/podcast_mgr
# --------------------------------
# #!/bin/sh
# . /etc/rc.subr
# name="podcast_mgr"
# rcvar="podcast_mgr_enable"
# command="/usr/local/sbin/fcgiwrap"
# command_args="-s unix:/var/run/podcast-mgr/fcgi.sock \
#               -f /usr/local/libexec/podcast-mgr/index.cgi"
# pidfile="/var/run/podcast-mgr/fcgi.pid"
# start_precmd="install -d -m 750 -o nuci3 -g www /var/run/podcast-mgr"
# load_rc_config $name
# run_rc_command "$1"
#
# /etc/rc.conf addition:
#   podcast_mgr_enable="YES"


# ── 3. spawn-fcgi one-liner ───────────────────────────────────────────────
#
# Quick start without a service manager:
#
#   mkdir -p /run/user/$(id -u)/podcast-mgr
#   spawn-fcgi \
#       -s /run/user/$(id -u)/podcast-mgr/fcgi.sock \
#       -M 0660 \
#       -n \
#       -- /path/to/index.cgi
#
# Then apply the ACL or group setup above so haproxy can reach the socket.


# ── Socket path convention ────────────────────────────────────────────────
#
# User unit (Linux):  /run/user/$(id -u nuci3)/podcast-mgr/fcgi.sock
# System unit (Linux/BSD): /var/run/podcast-mgr/fcgi.sock
#
# The haproxy server line must match whichever path is in use.
