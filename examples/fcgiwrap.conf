# fcgiwrap.conf — spawn and socket configuration for podcast-mgr
#
# fcgiwrap is the lightest-weight way to run a FastCGI worker on BSD/Linux.
# These examples cover three common deployment patterns:
#   1. systemd socket activation (Linux)
#   2. rc.d / daemon (FreeBSD / OpenBSD)
#   3. spawn-fcgi one-liner (any POSIX system)

# ── 1. systemd socket activation ──────────────────────────────────────────
#
# /etc/systemd/system/podcast-mgr.socket
# --------------------------------------
# [Unit]
# Description=podcast-mgr FastCGI socket
#
# [Socket]
# ListenStream=/var/run/podcast-mgr/fcgi.sock
# SocketUser=www-data
# SocketGroup=www-data
# SocketMode=0660
# DirectoryMode=0750
# RuntimeDirectory=podcast-mgr
# RuntimeDirectoryMode=0750
#
# [Install]
# WantedBy=sockets.target

# /etc/systemd/system/podcast-mgr.service
# ----------------------------------------
# [Unit]
# Description=podcast-mgr FastCGI worker
# Requires=podcast-mgr.socket
# After=podcast-mgr.socket
#
# [Service]
# Type=simple
# User=denzuko
# Group=www-data
#
# # Worker reads feeds.xml from here
# Environment=HOME=/home/denzuko
# # Environment=XDG_CONFIG_HOME=/home/denzuko/.config
#
# ExecStart=/usr/local/libexec/podcast-mgr/index.cgi
#
# # Restart on failure; index.cgi exits 1 if feeds.xml is missing
# Restart=on-failure
# RestartSec=5s
#
# StandardInput=socket
# StandardOutput=socket
#
# [Install]
# WantedBy=multi-user.target
#
# Enable:
#   systemctl enable --now podcast-mgr.socket


# ── 2. FreeBSD rc.d ───────────────────────────────────────────────────────
#
# /usr/local/etc/rc.d/podcast_mgr
# --------------------------------
# #!/bin/sh
# . /etc/rc.subr
# name="podcast_mgr"
# rcvar="podcast_mgr_enable"
# command="/usr/local/sbin/fcgiwrap"
# command_args="-s unix:/var/run/podcast-mgr/fcgi.sock \
#               -f /usr/local/libexec/podcast-mgr/index.cgi"
# pidfile="/var/run/podcast-mgr/fcgi.pid"
# start_precmd="install -d -m 750 -o denzuko -g www /var/run/podcast-mgr"
# load_rc_config $name
# run_rc_command "$1"
#
# /etc/rc.conf addition:
#   podcast_mgr_enable="YES"


# ── 3. spawn-fcgi one-liner ───────────────────────────────────────────────
#
# Quick start without a service manager:
#
#   install -d -m 750 /var/run/podcast-mgr
#   spawn-fcgi \
#       -s /var/run/podcast-mgr/fcgi.sock \
#       -M 0660 \
#       -u denzuko \
#       -g www \
#       -n \
#       -- /usr/local/libexec/podcast-mgr/index.cgi
#
# -s  Unix socket path (must match nginx/haproxy upstream)
# -M  Socket permissions (0660 = owner rw, group rw)
# -u  User to run the worker as
# -g  Group (should match the web server's group)
# -n  Do not daemonise (let the caller manage it)
#
# For a persistent session, wrap in tmux, screen, or daemontools.


# ── Socket path convention ────────────────────────────────────────────────
#
# All examples above use:
#   /var/run/podcast-mgr/fcgi.sock
#
# The directory must exist and be writable by the FastCGI worker user
# before the socket is created.  On Linux with systemd the RuntimeDirectory
# directive handles this automatically.  On BSD, use start_precmd or an
# rc.conf localisation hook.
