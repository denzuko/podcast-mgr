# haproxy.cfg — podcast-mgr FastCGI reference template
#
# TEMPLATE ONLY. Do not commit your live /etc/haproxy/haproxy.cfg —
# it contains site-specific paths and credentials.
#
# Before using: replace the placeholders marked with <ANGLE_BRACKETS>:
#   <USER>      — local user running fcgiwrap (e.g. the user who ran ./nob install)
#   <BUILDDIR>  — directory containing the built index.cgi
#
# Socket convention:
#   /run/fcgi/podcast-mgr.sock — shared dir created by tmpfiles.d
#   (see examples/podcast-mgr-tmpfiles.conf)
#   Owner: <USER>:www-data  mode: 2770
#   haproxy (group www-data) connects directly; no chroot bind-mounts needed.
#
# One-time root bootstrap:
#   # Replace <USER> throughout, then:
#   sudo cp examples/podcast-mgr-tmpfiles.conf /etc/tmpfiles.d/podcast-mgr.conf
#   sudo sed -i 's/<USER>/'"$(whoami)"'/g' /etc/tmpfiles.d/podcast-mgr.conf
#   sudo systemd-tmpfiles --create /etc/tmpfiles.d/podcast-mgr.conf
#   sudo loginctl enable-linger <USER>
#
# As <USER>:
#   cp examples/podcast-mgr.{socket,service} ~/.config/systemd/user/
#   systemctl --user daemon-reload
#   systemctl --user enable --now podcast-mgr.socket
#
# Merge the blocks below into /etc/haproxy/haproxy.cfg:

# ── fcgi-app ───────────────────────────────────────────────────────────────

fcgi-app podcast-mgr
    docroot <BUILDDIR>
    index   index.cgi

    # Vhost routing delivers requests as /index.cgi/<route>
    path-info ^/index\.cgi(/.*)$

    # kcgi uses SCRIPT_NAME for self-referential URLs
    set-param SCRIPT_NAME    /index.cgi
    set-param HOME           /home/<USER>
    # set-param XDG_CONFIG_HOME /home/<USER>/.config

# ── http frontend additions ────────────────────────────────────────────────
# Add to your existing http frontend:
#
#   acl is_podcast hdr(host) -i <YOUR_VHOST>
#   use_backend podcast_fcgi if is_podcast

# ── backend ────────────────────────────────────────────────────────────────

backend podcast_fcgi
    mode http
    server fcgi1 unix@/run/fcgi/podcast-mgr.sock proto fcgi
    use-fcgi-app podcast-mgr
