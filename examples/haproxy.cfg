# haproxy.cfg — podcast-mgr FastCGI configuration
#
# HAProxy 2.4+ supports FastCGI natively via the fcgi-app directive.
# This config routes /podcast/ to index.cgi over a Unix socket managed
# by fcgiwrap or spawn-fcgi.
#
# Paste the relevant sections into your existing haproxy.cfg.

global
    log /dev/log local0
    maxconn 256

defaults
    log     global
    mode    http
    option  httplog
    timeout connect  5s
    timeout client  30s
    timeout server  30s

# ── FastCGI application definition ────────────────────────────────────────
fcgi-app podcast-mgr
    # Path to the CGI binary — passed as SCRIPT_FILENAME
    docroot /usr/local/libexec/podcast-mgr
    index   index.cgi

    # PATH_INFO is everything after /podcast/index.cgi
    path-info ^(/.*)$

    # Environment variables forwarded to the FastCGI worker
    set-param HOME           /home/denzuko
    # set-param XDG_CONFIG_HOME /home/denzuko/.config

# ── Frontend ───────────────────────────────────────────────────────────────
frontend http_front
    bind *:80
    default_backend static_back

    # Route /podcast/ traffic to the FastCGI backend
    acl is_podcast path_beg /podcast/
    use_backend podcast_fcgi if is_podcast

    # Redirect bare /podcast to SPA shell
    acl is_podcast_bare path /podcast
    http-request redirect location /podcast/index.cgi/index if is_podcast_bare

# ── FastCGI backend ────────────────────────────────────────────────────────
backend podcast_fcgi
    mode http

    # Rewrite SCRIPT_NAME so kcgi sees the correct mount point
    http-request set-header X-Script-Name /podcast/index.cgi

    server fcgi1 unix@/var/run/podcast-mgr/fcgi.sock proto fcgi

    # Associate the fcgi-app definition
    use-fcgi-app podcast-mgr

# ── Static backend (placeholder) ──────────────────────────────────────────
backend static_back
    server web1 127.0.0.1:8080
