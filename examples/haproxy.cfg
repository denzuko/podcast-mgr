# haproxy.cfg — podcast-mgr FastCGI configuration
#
# Integration notes for the dapla.net haproxy deployment:
#
#   - haproxy runs as user haproxy / group www-data with chroot /var/lib/haproxy
#   - index.cgi runs as nuci3 via systemd user unit (fcgiwrap)
#   - Vhost: podcasts.dapla.net (hostname-based routing, not path-based)
#   - Socket must be reachable from inside the haproxy chroot
#
# Socket bridging (chroot):
#   haproxy's chroot means unix socket paths are resolved relative to
#   /var/lib/haproxy unless you bind-mount or symlink them in.
#   Recommended: bind-mount the socket dir into the chroot:
#
#     # /etc/systemd/system/haproxy.service.d/podcast-socket.conf
#     [Service]
#     BindReadOnlyPaths=/run/user/1001/podcast-mgr:/var/lib/haproxy/run/podcast-mgr
#
#   Then use the chroot-relative path in the server line:
#     server fcgi1 unix@/run/podcast-mgr/fcgi.sock proto fcgi
#
#   Alternative (simpler for dev): disable chroot in global {} — remove
#   or comment out the chroot line. Not recommended for production.
#
# Socket ACL (haproxy user must reach nuci3's socket):
#   sudo setfacl -m u:haproxy:rx /run/user/1001
#   sudo setfacl -m u:haproxy:rx /run/user/1001/podcast-mgr
#   sudo setfacl -dm u:haproxy:rw /run/user/1001/podcast-mgr
#   # or: sudo usermod -aG nuci3 haproxy
#
# loginctl enable-linger so socket survives without a login session:
#   sudo loginctl enable-linger nuci3

# ── Paste this fcgi-app block into your existing haproxy.cfg ──────────────

fcgi-app podcast-mgr
    # docroot must contain index.cgi — adjust to match actual install path
    docroot /home/nuci3/podcast-mgr
    index   index.cgi

    # Vhost routing arrives as /index.cgi/<route> (no /podcast/ prefix)
    # because haproxy already selected this backend by hostname.
    # Capture everything after index.cgi as PATH_INFO.
    path-info ^/index\.cgi(/.*)$

    # SCRIPT_NAME must match what kcgi uses to build self-referential URLs
    set-param SCRIPT_NAME  /index.cgi

    # HOME for resolve_config_path() -> ~/.config/podcasts/feeds.xml
    set-param HOME         /home/nuci3

    # Uncomment to override XDG config location:
    # set-param XDG_CONFIG_HOME /home/nuci3/.config

# ── Paste this backend block into your existing haproxy.cfg ───────────────

backend podcast_fcgi
    mode http

    # Socket path is chroot-relative when haproxy uses chroot /var/lib/haproxy.
    # With the bind-mount drop-in above this resolves to
    # /run/user/1001/podcast-mgr/fcgi.sock on the host.
    # Without the bind-mount, use the absolute host path and disable chroot.
    server fcgi1 unix@/run/podcast-mgr/fcgi.sock proto fcgi

    use-fcgi-app podcast-mgr

# ── systemd drop-in to bind-mount socket into haproxy chroot ─────────────
#
# /etc/systemd/system/haproxy.service.d/podcast-socket.conf
# ----------------------------------------------------------
# [Service]
# BindReadOnlyPaths=/run/user/1001/podcast-mgr:/var/lib/haproxy/run/podcast-mgr
#
# After creating:
#   sudo systemctl daemon-reload
#   sudo systemctl restart haproxy
#
# Verify the mount is present:
#   ls -la /var/lib/haproxy/run/podcast-mgr/
