# haproxy.cfg — podcast-mgr FastCGI configuration
#
# HAProxy 2.4+ native FastCGI via the fcgi-app directive.
# Requires fcgiwrap running on a Unix socket (see fcgiwrap.conf).
#
# Dev host quick-start (Linux):
#
#   # 1. Build
#   cc -o nob nob.c && ./nob
#
#   # 2. Start fcgiwrap on the socket
#   install -d -m 750 /var/run/podcast-mgr
#   fcgiwrap -s unix:/var/run/podcast-mgr/fcgi.sock &
#     -- or via systemd socket activation, see fcgiwrap.conf --
#
#   # 3. Start haproxy with this config
#   haproxy -f examples/haproxy.cfg
#
#   # 4. Browse to http://localhost:8080/podcast/index.cgi/index
#
# Production install: adjust DOCROOT and HOME below, then deploy
# index.cgi to DOCROOT and manage the socket via rc.d / systemd.
#
# HAProxy version requirement: 2.4+ (fcgi-app directive)
#   apt install haproxy   # Debian/Ubuntu 22.04+ ships 2.4
#   pkg install haproxy   # FreeBSD ports

global
    log /dev/log local0
    maxconn 256

defaults
    log     global
    mode    http
    option  httplog
    timeout connect  5s
    timeout client  30s
    timeout server  30s

# ── FastCGI application definition ────────────────────────────────────────
#
# docroot: directory containing index.cgi.
#   Dev:  absolute path to repo checkout, e.g. /home/denzuko/podcast-mgr
#   Prod: /usr/local/libexec/podcast-mgr
#
# path-info: captures the route suffix after SCRIPT_NAME (/index.cgi).
#   HAProxy matches SCRIPT_NAME as everything up to (but not including)
#   the first path-info capture group.  The pattern below strips the
#   /podcast/index.cgi prefix so kcgi receives only the route token
#   (/index, /list, /add, /edit, /save, /delete).
#
# set-param HOME: kcgi worker calls getenv("HOME") via resolve_config_path
#   to locate ~/.config/podcasts/feeds.xml.  Must match the user running
#   the fcgiwrap/index.cgi process.

fcgi-app podcast-mgr
    docroot /home/denzuko/podcast-mgr
    index   index.cgi

    # Capture PATH_INFO as the suffix after /podcast/index.cgi
    path-info ^/podcast/index\.cgi(/.*)$

    # Worker identity — resolve_config_path uses HOME to find feeds.xml
    set-param HOME           /home/denzuko
    # set-param XDG_CONFIG_HOME /home/denzuko/.config

# ── Frontend ───────────────────────────────────────────────────────────────
frontend http_front
    bind *:8080

    # Redirect bare /podcast to the SPA shell
    acl is_podcast_bare path /podcast
    http-request redirect location /podcast/index.cgi/index if is_podcast_bare

    # Route all /podcast/ requests to the FastCGI backend
    acl is_podcast path_beg /podcast/
    use_backend podcast_fcgi if is_podcast

    default_backend static_back

# ── FastCGI backend ────────────────────────────────────────────────────────
backend podcast_fcgi
    mode http

    # fcgiwrap Unix socket — must match the socket path in fcgiwrap.conf
    server fcgi1 unix@/var/run/podcast-mgr/fcgi.sock proto fcgi

    use-fcgi-app podcast-mgr

# ── Static backend (placeholder — replace with your actual static server) ──
backend static_back
    server web1 127.0.0.1:80
