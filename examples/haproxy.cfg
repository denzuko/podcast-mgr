# haproxy.cfg — podcast-mgr FastCGI configuration
#
# HAProxy 2.4+ native FastCGI via the fcgi-app directive.
# Requires fcgiwrap running on a Unix socket (see fcgiwrap.conf).
#
# Dev host quick-start (Linux, nuci3 user unit + system haproxy):
#
#   # One-time root setup:
#   sudo loginctl enable-linger nuci3
#   sudo usermod -aG nuci3 haproxy      # grant haproxy socket access
#   sudo systemctl reload haproxy
#
#   # As nuci3:
#   mkdir -p ~/.config/systemd/user
#   cp examples/podcast-mgr.socket examples/podcast-mgr.service \
#      ~/.config/systemd/user/
#   systemctl --user daemon-reload
#   systemctl --user enable --now podcast-mgr.socket
#
#   # Start haproxy (system service picks up config on reload):
#   sudo haproxy -f examples/haproxy.cfg -c   # validate first
#   sudo systemctl reload haproxy
#
#   # Browse to http://localhost:8080/podcast/index.cgi/index
#
# HAProxy version requirement: 2.4+ (fcgi-app directive)

global
    log /dev/log local0
    maxconn 256

defaults
    log     global
    mode    http
    option  httplog
    timeout connect  5s
    timeout client  30s
    timeout server  30s

# ── FastCGI application definition ────────────────────────────────────────
#
# docroot: directory containing index.cgi.
#   Dev:  /home/nuci3/podcast-mgr   (repo checkout)
#   Prod: /usr/local/libexec/podcast-mgr
#
# path-info captures the route suffix after SCRIPT_NAME (/index.cgi).
# Pattern strips /podcast/index.cgi so kcgi receives only the route
# token (/index, /list, /add, /edit, /save, /delete) as PATH_INFO.
#
# HOME must match the user running fcgiwrap (nuci3) so index.cgi can
# locate ~/.config/podcasts/feeds.xml via resolve_config_path().

fcgi-app podcast-mgr
    docroot /home/nuci3/podcast-mgr
    index   index.cgi

    path-info ^/podcast/index\.cgi(/.*)$

    set-param HOME           /home/nuci3
    # set-param XDG_CONFIG_HOME /home/nuci3/.config

# ── Frontend ───────────────────────────────────────────────────────────────
frontend http_front
    bind *:8080

    # Redirect bare /podcast to the SPA shell
    acl is_podcast_bare path /podcast
    http-request redirect location /podcast/index.cgi/index if is_podcast_bare

    # Route all /podcast/ requests to the FastCGI backend
    acl is_podcast path_beg /podcast/
    use_backend podcast_fcgi if is_podcast

    default_backend static_back

# ── FastCGI backend ────────────────────────────────────────────────────────
backend podcast_fcgi
    mode http

    # User-unit socket path: /run/user/<UID>/podcast-mgr/fcgi.sock
    # Find nuci3's UID with: id -u nuci3
    # For system-unit deployment use /var/run/podcast-mgr/fcgi.sock instead.
    server fcgi1 unix@/run/user/1001/podcast-mgr/fcgi.sock proto fcgi

    use-fcgi-app podcast-mgr

# ── Static backend (placeholder — replace with your actual static server) ──
backend static_back
    server web1 127.0.0.1:80
