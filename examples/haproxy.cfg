# haproxy.cfg — podcast-mgr FastCGI reference template
#
# This is a REFERENCE TEMPLATE only. Do not commit your live
# /etc/haproxy/haproxy.cfg to this repo — it contains secrets.
#
# Integration with dapla.net haproxy deployment:
#   - Vhost: podcasts.dapla.net (hostname ACL in http frontend)
#   - haproxy runs as user haproxy / group www-data / chroot /var/lib/haproxy
#   - index.cgi runs as nuci3 via systemd user unit (fcgiwrap)
#   - Socket: /run/fcgi/podcast-mgr.sock (shared dir, nuci3:www-data 2770)
#
# One-time root bootstrap:
#   sudo cp examples/podcast-mgr-tmpfiles.conf /etc/tmpfiles.d/podcast-mgr.conf
#   sudo systemd-tmpfiles --create /etc/tmpfiles.d/podcast-mgr.conf
#   sudo loginctl enable-linger nuci3
#
# As nuci3:
#   cp examples/podcast-mgr.{socket,service} ~/.config/systemd/user/
#   systemctl --user daemon-reload
#   systemctl --user enable --now podcast-mgr.socket
#
# Then merge the fcgi-app and backend blocks below into /etc/haproxy/haproxy.cfg
# and add the acl + use_backend lines to your http frontend.

# ── Merge into existing haproxy.cfg ───────────────────────────────────────

fcgi-app podcast-mgr
    docroot /home/nuci3/podcast-mgr
    index   index.cgi

    # Vhost routing delivers requests as /index.cgi/<route> — no path prefix
    path-info ^/index\.cgi(/.*)$

    # kcgi uses SCRIPT_NAME to build self-referential URLs
    set-param SCRIPT_NAME    /index.cgi
    set-param HOME           /home/nuci3
    # set-param XDG_CONFIG_HOME /home/nuci3/.config

# ── http frontend additions ────────────────────────────────────────────────
#
#   acl is_podcast hdr(host) -i podcasts.dapla.net
#   use_backend podcast_fcgi if is_podcast

# ── backend ────────────────────────────────────────────────────────────────

backend podcast_fcgi
    mode http
    # /run/fcgi is outside haproxy chroot — path is absolute on the host.
    # haproxy resolves unix@ paths relative to chroot only for relative paths;
    # absolute paths starting with / are used as-is by the kernel.
    server fcgi1 unix@/run/fcgi/podcast-mgr.sock proto fcgi
    use-fcgi-app podcast-mgr
