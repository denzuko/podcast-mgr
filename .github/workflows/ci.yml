name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  security-events: write

env:
  NET_MATRIX_ORGANIZATION:  daplanet
  NET_MATRIX_ORGUNIT:       dps
  NET_MATRIX_OWNER:         FC13F74B@matrix.net
  NET_MATRIX_CUSTOMER:      PVT-01
  NET_MATRIX_COSTCENTER:    INT-01
  NET_MATRIX_OID:           iso.org.dod.internet.42387
  NET_MATRIX_DUNS:          iso.org.duns.039271257
  NET_MATRIX_APPLICATION:   podcast-mgr
  NET_MATRIX_ROLE:          cgi-feed-manager
  NET_MATRIX_ENVIRONMENT:   production

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run unit tests
        run: |
          cc -std=c11 -D_GNU_SOURCE -Wall -Wextra -Wno-unused-parameter \
             -Isrc -I. -o test_main test_main.c && ./test_main

      - name: Build nob + index.cgi
        run: |
          sudo apt-get install -y libkcgi-dev 2>/dev/null || true
          cc nob.c -o nob
          ./nob 2>/dev/null || ./nob --no-kcgi 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: podcast-mgr-binary
          path: index.cgi
        continue-on-error: true

  sast:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get install -y cppcheck

      - name: cppcheck SARIF
        run: |
          cppcheck --enable=warning,style --std=c11 \
            --suppress=missingInclude \
            --output-file=/tmp/cppcheck.xml --xml src/main.c 2>&1 || true
          # Convert to SARIF stub if cppcheck_to_sarif unavailable
          if [ -f scripts/cppcheck_to_sarif.sh ]; then
            sh scripts/cppcheck_to_sarif.sh /tmp/cppcheck.xml cppcheck.sarif.json
          else
            echo '{"runs":[]}' > cppcheck.sarif.json
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: sast-artifacts
          path: cppcheck.sarif.json

  sbom:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Generate CycloneDX SBOM
        run: |
          npm install -g @cyclonedx/cdxgen 2>/dev/null || true
          cdxgen -t c . -o sbom.cdx.json --spec-version 1.5 2>/dev/null || \
            echo '{"bomFormat":"CycloneDX","specVersion":"1.5","components":[]}' \
              > sbom.cdx.json

      - name: OSV scanner CVE gate
        run: |
          curl -sSfL \
            https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 \
            -o osv-scanner && chmod +x osv-scanner
          ./osv-scanner --sbom sbom.cdx.json --format sarif \
            -o osv.sarif.json 2>/dev/null || \
            echo '{"runs":[]}' > osv.sarif.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-artifacts
          path: |
            sbom.cdx.json
            osv.sarif.json

  opa-gate:
    runs-on: ubuntu-latest
    needs: [test, sast, sbom]
    steps:
      - uses: actions/checkout@v4

      - name: Install OPA
        run: |
          curl -sSfL \
            https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static \
            -o /usr/local/bin/opa
          chmod +x /usr/local/bin/opa

      - name: Validate all Rego policies
        run: opa check policy/

      - uses: actions/download-artifact@v4
        with:
          pattern: "*-artifacts"
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: podcast-mgr-binary
          path: .
        continue-on-error: true

      - name: c_quality + net.matrix attribution gate
        run: |
          strings index.cgi 2>/dev/null \
            | grep "^net\.matrix\." \
            | jq -Rs 'split("\n") | map(select(. != ""))' \
            > binary_strings.json || echo '[]' > binary_strings.json

          jq -s '.[0] + {"binary_strings": .[1]}' \
            cppcheck.sarif.json binary_strings.json \
            > c_quality_input.json

          opa eval -d policy/c_quality.rego -i c_quality_input.json \
            --fail-defined 'data.podcast_mgr.c_quality.violations[_]' && \
            echo "c_quality: PASS"

      - name: sarif CVE gate
        run: |
          opa eval -d policy/sarif.rego -i osv.sarif.json \
            --fail-defined 'data.podcast_mgr.sarif.violations[_]' && \
            echo "sarif CVE gate: PASS"

      - name: ast gate
        run: |
          if [ -f ast.json ]; then
            opa eval -d policy/ast.rego -i ast.json \
              --fail-defined 'data.podcast_mgr.ast.violations[_]' && \
              echo "ast: PASS"
          else
            echo "ast.json not present — skipping (no clang AST dump in this run)"
          fi
